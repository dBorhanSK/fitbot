services:
  - type: web
    name: fitbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --timeout 90 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: OWNER_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SETUP_KEY
        sync: false
      - key: COACH_USERNAME
        sync: false
      - key: KEEPALIVE
        value: "1"
      - key: KEEPALIVE_SECONDS
        value: "480"
      - key: UPDATE_WORKERS
        value: "6"
